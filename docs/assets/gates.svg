<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="gt gd" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title id="gt">MCP Bastion: JSON-RPC transit through allow / deny / redact gates</title>
  <desc id="gd">A neon zero-trust control room. Newline-delimited JSON-RPC lines enter from the client on the left, pass a size and shape check, then split at three lit gates: allowed calls are forwarded, denied calls are stopped, and permitted calls with credential arguments are redacted before leaving on the right.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050a18"/>
      <stop offset="1" stop-color="#0a1330"/>
    </linearGradient>
    <linearGradient id="cyanwire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0af5ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0af5ff"/>
      <stop offset="1" stop-color="#0af5ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="allowg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#12ffd6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#12ffd6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="denyg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2b4e" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ff2b4e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb020" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffb020" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="400" fill="url(#bg)"/>

  <!-- faint grid -->
  <g opacity="0.10">
    <g stroke="#2de3ff">
      <line x1="0" y1="80" x2="960" y2="80"/><line x1="0" y1="160" x2="960" y2="160"/>
      <line x1="0" y1="240" x2="960" y2="240"/><line x1="0" y1="320" x2="960" y2="320"/>
      <line x1="160" y1="0" x2="160" y2="400"/><line x1="320" y1="0" x2="320" y2="400"/>
      <line x1="480" y1="0" x2="480" y2="400"/><line x1="640" y1="0" x2="640" y2="400"/>
      <line x1="800" y1="0" x2="800" y2="400"/>
    </g>
  </g>

  <text x="28" y="40" fill="#eaf6ff" font-size="20" font-weight="700" letter-spacing="3">MCP&#160;BASTION</text>
  <text x="28" y="60" fill="#5fd6ff" font-size="11" letter-spacing="2">ZERO-TRUST JSON-RPC TRANSIT HUB · stdin ▸ stdout</text>

  <!-- client node -->
  <g transform="translate(28,150)">
    <rect width="118" height="100" rx="8" fill="#0b1a3a" stroke="#2de3ff" stroke-width="1.5"/>
    <text x="59" y="30" text-anchor="middle" fill="#8fe9ff" font-size="12" font-weight="600">MCP CLIENT</text>
    <text x="59" y="52" text-anchor="middle" fill="#4f9fd0" font-size="9">newline JSON-RPC</text>
    <text x="59" y="72" text-anchor="middle" fill="#4f9fd0" font-size="9">on stdin</text>
    <circle cx="59" cy="86" r="4" fill="#12ffd6"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- inspection column -->
  <g transform="translate(190,130)">
    <rect width="150" height="140" rx="10" fill="#081128" stroke="#ff2b4e" stroke-width="1.2" opacity="0.9"/>
    <text x="75" y="26" text-anchor="middle" fill="#ff6b83" font-size="11" font-weight="700" letter-spacing="1">INSPECTION</text>
    <line x1="16" y1="36" x2="134" y2="36" stroke="#233a63"/>
    <text x="18" y="58" fill="#bfe7ff" font-size="10">size ≤ max_bytes</text>
    <text x="18" y="78" fill="#bfe7ff" font-size="10">shape is {object}</text>
    <text x="18" y="98" fill="#bfe7ff" font-size="10">extract method</text>
    <text x="18" y="118" fill="#bfe7ff" font-size="10">extract params.name</text>
    <text x="18" y="134" fill="#6f86b0" font-size="8.5">fail-closed field scan</text>
  </g>

  <!-- three gates -->
  <g transform="translate(430,60)">
    <!-- allow gate -->
    <g transform="translate(0,10)">
      <circle cx="60" cy="34" r="30" fill="url(#allowg)"/>
      <rect width="150" height="70" rx="10" x="0" y="0" fill="#06231c" stroke="#12ffd6" stroke-width="1.6"/>
      <text x="75" y="30" text-anchor="middle" fill="#8dffe6" font-size="12" font-weight="700">ALLOW → FORWARD</text>
      <text x="75" y="50" text-anchor="middle" fill="#4fc9ad" font-size="9">allow_tool match, deny loses</text>
    </g>
    <!-- redact gate -->
    <g transform="translate(0,120)">
      <circle cx="60" cy="34" r="30" fill="url(#redg)"/>
      <rect width="150" height="70" rx="10" x="0" y="0" fill="#241a05" stroke="#ffb020" stroke-width="1.6"/>
      <text x="75" y="30" text-anchor="middle" fill="#ffd579" font-size="12" font-weight="700">REDACT → FORWARD</text>
      <text x="75" y="50" text-anchor="middle" fill="#c79a4a" font-size="9">value spans → «redacted»</text>
    </g>
    <!-- deny gate -->
    <g transform="translate(0,230)">
      <circle cx="60" cy="34" r="30" fill="url(#denyg)"/>
      <rect width="150" height="70" rx="10" x="0" y="0" fill="#2a0710" stroke="#ff2b4e" stroke-width="1.6"/>
      <text x="75" y="30" text-anchor="middle" fill="#ff8ea0" font-size="12" font-weight="700">DENY / DROP ✕</text>
      <text x="75" y="50" text-anchor="middle" fill="#c85e6d" font-size="9">deny_tool · default · limit</text>
    </g>
  </g>

  <!-- server node -->
  <g transform="translate(814,150)">
    <rect width="118" height="100" rx="8" fill="#0b1a3a" stroke="#12ffd6" stroke-width="1.5"/>
    <text x="59" y="30" text-anchor="middle" fill="#8dffe6" font-size="12" font-weight="600">MCP SERVER</text>
    <text x="59" y="52" text-anchor="middle" fill="#4f9fd0" font-size="9">permitted +</text>
    <text x="59" y="70" text-anchor="middle" fill="#4f9fd0" font-size="9">redacted on stdout</text>
    <circle cx="59" cy="86" r="4" fill="#12ffd6"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- wires client -> inspection -->
  <path id="w0" d="M146 200 L190 200" stroke="url(#cyanwire)" stroke-width="2" fill="none"/>

  <!-- wires inspection -> gates -->
  <path id="wAllow" d="M340 200 C 390 200 400 108 430 104" stroke="#12ffd6" stroke-width="1.4" fill="none" opacity="0.5"/>
  <path id="wRed"   d="M340 200 C 395 200 405 214 430 214" stroke="#ffb020" stroke-width="1.4" fill="none" opacity="0.5"/>
  <path id="wDeny"  d="M340 200 C 390 200 400 300 430 324" stroke="#ff2b4e" stroke-width="1.4" fill="none" opacity="0.5"/>

  <!-- wires gates -> server -->
  <path id="wOutA" d="M580 104 C 690 104 720 190 814 198" stroke="#12ffd6" stroke-width="1.4" fill="none" opacity="0.5"/>
  <path id="wOutR" d="M580 214 C 690 214 720 202 814 202" stroke="#ffb020" stroke-width="1.4" fill="none" opacity="0.5"/>

  <!-- packet legend of what flows -->
  <g font-size="9" fill="#6f86b0">
    <text x="150" y="300">read_file · list_dir · search_files · get_metadata  ▸ allow</text>
    <text x="150" y="316">*token* · *secret* · api_key · authorization         ▸ redact</text>
    <text x="150" y="332">shell.* · fs.delete · net.* · unknown · no-name       ▸ deny</text>
  </g>

  <!-- animated request packets -->
  <!-- allowed packet -->
  <g filter="url(#glow)">
    <circle r="6" fill="#12ffd6">
      <animateMotion dur="4s" repeatCount="indefinite" keyPoints="0;0.5;0.5;1" keyTimes="0;0.45;0.5;1" calcMode="linear"
        path="M146 200 L190 200 C 260 200 380 108 430 104 C 540 104 690 104 720 190 L 814 198"/>
    </circle>
  </g>
  <!-- redacted packet: turns amber mid-flight -->
  <g filter="url(#glow)">
    <circle r="6">
      <animate attributeName="fill" values="#12ffd6;#12ffd6;#ffb020;#ffb020" dur="4.6s" repeatCount="indefinite" keyTimes="0;0.48;0.52;1"/>
      <animateMotion dur="4.6s" begin="0.8s" repeatCount="indefinite"
        path="M146 200 L190 200 C 300 200 405 214 430 214 C 560 214 720 202 814 202"/>
    </circle>
  </g>
  <!-- denied packet: fades to red and stops at the deny gate -->
  <g filter="url(#glow)">
    <circle r="6">
      <animate attributeName="fill" values="#12ffd6;#ff2b4e;#ff2b4e" dur="3s" repeatCount="indefinite" keyTimes="0;0.7;1"/>
      <animate attributeName="opacity" values="1;1;0" dur="3s" repeatCount="indefinite" keyTimes="0;0.72;1"/>
      <animateMotion dur="3s" begin="1.6s" repeatCount="indefinite"
        path="M146 200 L190 200 C 300 200 400 300 430 324"/>
    </circle>
  </g>

  <!-- deny spark -->
  <g transform="translate(490,304)">
    <text font-size="18" fill="#ff2b4e" text-anchor="middle" opacity="0">✕
      <animate attributeName="opacity" values="0;1;0" dur="3s" begin="2.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- audit tap -->
  <path d="M505 130 L505 372 L900 372" stroke="#5fd6ff" stroke-width="1" fill="none" stroke-dasharray="4 4" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="0;-16" dur="1s" repeatCount="indefinite"/>
  </path>
  <text x="700" y="388" fill="#5fd6ff" font-size="9" letter-spacing="1">one JSON audit event per message ▸ stderr | --audit file</text>
</svg>

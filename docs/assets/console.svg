<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="ct cd" font-family="'Cascadia Code','Consolas','SF Mono',ui-monospace,monospace">
  <title id="ct">MCP Bastion audit console: decision radar and live event terminal</title>
  <desc id="cd">A dark control-room console. On the left a cyan radar sweeps across four decision rings (forward, deny, drop, error), pinging blips as audit events arrive. On the right a terminal streams one JSON audit line per message and a cross-language recount that confirms the gateway summary matches.</desc>

  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04081a"/>
      <stop offset="1" stop-color="#0a1030"/>
    </linearGradient>
    <radialGradient id="scope" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#08301f"/>
      <stop offset="1" stop-color="#041022"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12ffd6" stop-opacity="0"/>
      <stop offset="1" stop-color="#12ffd6" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="cglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="400" fill="url(#cbg)"/>

  <!-- title bar -->
  <rect x="0" y="0" width="960" height="34" fill="#06102a"/>
  <circle cx="20" cy="17" r="5" fill="#ff2b4e"/><circle cx="38" cy="17" r="5" fill="#ffb020"/><circle cx="56" cy="17" r="5" fill="#12ffd6"/>
  <text x="80" y="21" fill="#8fe9ff" font-size="12" letter-spacing="1">console · report / tail / policy · node stdlib only</text>
  <text x="770" y="21" fill="#4f9fd0" font-size="11">AUDIT LINK ● LIVE</text>

  <!-- ===== RADAR ===== -->
  <g transform="translate(200,222)">
    <circle r="150" fill="url(#scope)" stroke="#12583f" stroke-width="1.4"/>
    <circle r="112" fill="none" stroke="#12583f" stroke-width="1" opacity="0.7"/>
    <circle r="74" fill="none" stroke="#12583f" stroke-width="1" opacity="0.7"/>
    <circle r="36" fill="none" stroke="#12583f" stroke-width="1" opacity="0.7"/>
    <line x1="-150" y1="0" x2="150" y2="0" stroke="#12583f" stroke-width="0.8" opacity="0.6"/>
    <line x1="0" y1="-150" x2="0" y2="150" stroke="#12583f" stroke-width="0.8" opacity="0.6"/>

    <!-- ring labels -->
    <text x="0" y="-118" text-anchor="middle" fill="#5fd6ff" font-size="9">forward</text>
    <text x="0" y="-80" text-anchor="middle" fill="#ff8ea0" font-size="9">deny</text>
    <text x="0" y="-42" text-anchor="middle" fill="#ffd579" font-size="9">drop</text>
    <text x="0" y="14" text-anchor="middle" fill="#6f86b0" font-size="9">error</text>

    <!-- rotating sweep -->
    <g>
      <path d="M0 0 L150 0 A150 150 0 0 1 106 106 Z" fill="url(#sweep)"/>
      <line x1="0" y1="0" x2="150" y2="0" stroke="#12ffd6" stroke-width="2"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </g>

    <!-- blips: forward (cyan) -->
    <circle cx="70" cy="-90" r="4" fill="#12ffd6" filter="url(#cglow)"><animate attributeName="opacity" values="0;1;1;0.2" dur="4s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="-60" cy="-95" r="4" fill="#12ffd6" filter="url(#cglow)"><animate attributeName="opacity" values="0;1;1;0.2" dur="4s" begin="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="95" cy="55" r="4" fill="#12ffd6" filter="url(#cglow)"><animate attributeName="opacity" values="0;1;1;0.2" dur="4s" begin="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="-30" cy="100" r="4" fill="#12ffd6" filter="url(#cglow)"><animate attributeName="opacity" values="0;1;1;0.2" dur="4s" begin="2.4s" repeatCount="indefinite"/></circle>
    <!-- deny (red) -->
    <circle cx="-100" cy="30" r="4.5" fill="#ff2b4e" filter="url(#cglow)"><animate attributeName="opacity" values="0;1;1;0.2" dur="4s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="-30" r="4.5" fill="#ff2b4e" filter="url(#cglow)"><animate attributeName="opacity" values="0;1;1;0.2" dur="4s" begin="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="115" r="4.5" fill="#ff2b4e" filter="url(#cglow)"><animate attributeName="opacity" values="0;1;1;0.2" dur="4s" begin="1.4s" repeatCount="indefinite"/></circle>

    <circle r="4" fill="#eaf6ff"/>
  </g>
  <text x="200" y="392" text-anchor="middle" fill="#4f9fd0" font-size="9">demo: 4 forward · 6 deny · 0 drop · 0 error</text>

  <!-- ===== TERMINAL ===== -->
  <g transform="translate(392,54)">
    <rect width="544" height="300" rx="8" fill="#040a1c" stroke="#173a63" stroke-width="1.2"/>
    <rect width="544" height="24" rx="8" fill="#0a1732"/>
    <text x="12" y="16" fill="#5fd6ff" font-size="10">$ node console/dist/cli.js tail sessions/demo-audit.jsonl</text>

    <g font-size="10.5">
      <text x="12" y="46" fill="#12ffd6">#3 FORWARD read_file      allow_tool read_file</text>
      <text x="12" y="64" fill="#12ffd6">#4 FORWARD list_dir       allow_tool list_dir <tspan fill="#ffb020">[redacted: api_key]</tspan></text>
      <text x="12" y="82" fill="#12ffd6">#5 FORWARD search_files   allow_tool search_files <tspan fill="#ffb020">[redacted: access_token]</tspan></text>
      <text x="12" y="100" fill="#ff6b83">#6 DENY    shell.exec     deny_tool shell.*</text>
      <text x="12" y="118" fill="#ff6b83">#7 DENY    fs.delete      deny_tool fs.delete</text>
      <text x="12" y="136" fill="#ff6b83">#8 DENY    format_disk    default deny</text>
      <text x="12" y="154" fill="#12ffd6">#9 FORWARD get_metadata   allow_tool get_metadata <tspan fill="#ffb020">[redacted: authorization]</tspan></text>
      <text x="12" y="172" fill="#ff6b83">#10 DENY   -              tools/call missing extractable params.name</text>
    </g>

    <line x1="12" y1="188" x2="532" y2="188" stroke="#173a63"/>
    <text x="12" y="208" fill="#5fd6ff" font-size="10">$ node console/dist/cli.js report sessions/demo-audit.jsonl</text>

    <g font-size="10.5" fill="#bfe7ff">
      <text x="12" y="230">Decisions   forward <tspan fill="#12ffd6">4</tspan> ####........  deny <tspan fill="#ff6b83">6</tspan> ############</text>
      <text x="12" y="248">Redaction events : 3   ·   Unbalanced msgs : 0   ·   Max depth : 3</text>
      <text x="12" y="266" fill="#12ffd6">Gateway summary : MATCHES  <tspan fill="#6f86b0">(cross-language recount agrees)</tspan></text>
    </g>

    <!-- blinking cursor -->
    <rect x="12" y="278" width="8" height="13" fill="#12ffd6">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <text x="26" y="289" fill="#5fd6ff" font-size="10">_</text>

    <!-- scanline shimmer -->
    <rect x="1" y="26" width="542" height="2" fill="#12ffd6" opacity="0.12">
      <animate attributeName="y" values="28;296;28" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>

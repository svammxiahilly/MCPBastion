<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="ct cd" font-family="'Cascadia Code','Consolas','SF Mono',ui-monospace,monospace">
  <title id="ct">MCP Bastion audit console: decision radar and live event terminal</title>
  <desc id="cd">A dark control-room console. On the left a cyan radar sweeps across four decision rings (forward, deny, drop, error), pinging blips as audit events arrive. On the right a terminal streams one JSON audit line per message and a cross-language recount that confirms the gateway summary matches.</desc>

  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04081a"/>
      <stop offset="1" stop-color="#0a1030"/>
    </linearGradient>
    <radialGradient id="scope" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#08301f"/>
      <stop offset="1" stop-color="#041022"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12ffd6" stop-opacity="0"/>
      <stop offset="1" stop-color="#12ffd6" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="cglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
